<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useCallback } = React;


const C = {
  cream:"#F5F0E8", linen:"#EDE4D3", stone:"#D4C5A9",
  warmText:"#3D2E1A", mutedText:"#7A6A52",
  accent:"#C17A3A", accentLight:"#F0DFC0",
  redWarm:"#C0392B", redLight:"#FDECEA",
  greenWarm:"#2E7D52", greenLight:"#E8F5EE",
  blueWarm:"#1A5C8A", blueLight:"#E6F0F8",

const FONT = "'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif";

// ── Shared UI ──────────────────────────────────────────────────────────────────

function BackBtn({ onBack }) {
  return (
    <button onClick={onBack} style={{
      background:"rgba(255,255,255,0.6)", border:"1px solid " + C.stone + "60",
      borderRadius:50, padding:"8px 20px", fontSize:16, color:C.mutedText,
      cursor:"pointer", fontFamily:FONT, marginBottom:28,

function Card({ children, style }) {
  return (
    <div style={{
      background:"rgba(255,255,255,0.68)", borderRadius:22,
      padding:"18px 20px", backdropFilter:"blur(8px)",
      border:"1px solid " + C.stone + "30", marginBottom:12, ...style,

}

function InfoCard({ icon, label, text, bg, color, labelColor }) {
  return (
    <div style={{
      background:bg||C.accentLight, borderRadius:16, padding:"14px 16px",
      marginBottom:10, display:"flex", gap:12, alignItems:"flex-start",
    }}>
      <span style={{
        width:40, height:40, borderRadius:"50%", background:"rgba(255,255,255,0.65)",
        display:"flex", alignItems:"center", justifyContent:"center",
        fontSize:18, flexShrink:0,
      }}>{icon}</span>
      <div>
        <div style={{ fontSize:13, color:labelColor||C.mutedText, fontWeight:700, marginBottom:3 }}>{label}</div>
        <div style={{ fontSize:19, fontWeight:700, color:color||C.warmText, lineHeight:1.55 }}>{text}</div>

}

function BigBtn({ onClick, disabled, bg, children }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width:"100%", background:disabled ? C.stone : (bg||C.accent),
      color:"#fff", border:"none", borderRadius:50, padding:"18px 0",
      fontSize:21, fontWeight:700,
      cursor:disabled ? "default" : "pointer",
      fontFamily:FONT, marginTop:12, transition:"background 0.2s",
    }}>{children}</button>
  );
}

function GhostBtn({ onClick, children }) {
  return (
    <button onClick={onClick} style={{
      width:"100%", background:"transparent", color:C.mutedText,
      border:"1.5px solid " + C.stone, borderRadius:50, padding:"14px 0",
      fontSize:17, cursor:"pointer", fontFamily:FONT, marginTop:8,
    }}>{children}</button>
  );
}

function Spinner({ emoji, text }) {
  return (
    <div style={{ textAlign:"center", padding:"64px 0" }}>
      <div style={{ fontSize:56, marginBottom:20 }}>{emoji||"🤔"}</div>
      <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:20 }}>
        {[0,1,2].map(function(i) {
          return (
            <div key={i} style={{
              width:13, height:13, borderRadius:"50%", background:C.accent,
              animation:"pulse 1.4s " + (i*0.2) + "s ease-in-out infinite", opacity:0.7,
            }} />
          );
        })}
      </div>
      <div style={{ fontSize:19, color:C.mutedText, lineHeight:1.7, whiteSpace:"pre-line" }}>{text}</div>
    </div>
  );
}

function ErrBox({ msg, onReset }) {
  return (
    <div>
      <div style={{ background:C.redLight, borderRadius:16, padding:"20px 20px" }}>
        <div style={{ fontSize:28, marginBottom:8 }}>😔</div>
        <div style={{ fontSize:16, color:C.redWarm, lineHeight:1.6 }}>
          出了点问题：<br /><strong>{msg}</strong><br />请稍后再试。
        </div>
      </div>
      <GhostBtn onClick={onReset}>↩ 重新来一次</GhostBtn>
    </div>
  );
}

// ── API helpers ────────────────────────────────────────────────────────────────

async function callClaude(system, userContent, maxTokens) {
  var res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens: maxTokens || 1200,
      system: system,
      messages:[{ role:"user", content:userContent }],
    }),
  });
  if (!res.ok) throw new Error("请求失败 " + res.status);
  var d = await res.json();
  var raw = d.content.map(function(b) { return b.text||""; }).join("");
  return JSON.parse(raw.replace(/```json|```/g,"").trim());
}

function imgBlock(b64, mime) {
  return { type:"image", source:{ type:"base64", media_type:mime, data:b64 } };
}

function useImagePicker() {
  var _s = useState(null); var src = _s[0]; var setSrc = _s[1];
  var _b = useState(null); var b64 = _b[0]; var setB64 = _b[1];
  var _m = useState(null); var mime = _m[0]; var setMime = _m[1];
  var ref = useRef();
  var load = useCallback(function(file) {
    if (!file || !file.type.startsWith("image/")) return;
    var r = new FileReader();
    r.onload = function(e) {
      setSrc(e.target.result);
      setB64(e.target.result.split(",")[1]);
      setMime(file.type);
    };
    r.readAsDataURL(file);
  }, []);
  function clear() { setSrc(null); setB64(null); setMime(null); }
  return { src:src, b64:b64, mime:mime, ref:ref, load:load, clear:clear };
}

// ── Home ───────────────────────────────────────────────────────────────────────

var MODULES = [
  { id:"meds",  emoji:"💊", title:"看药品说明",   desc:"拍一张药盒，AI 告诉您怎么吃",   bg:C.accentLight, badge:"最常用", bc:C.accent   },
  { id:"fraud", emoji:"🛡️", title:"防骗安全查验", desc:"可疑消息或截图？AI 帮您识别",   bg:C.redLight,    badge:"保护您", bc:C.redWarm  },
  { id:"guide", emoji:"📱", title:"手机操作指南", desc:"不会用某功能？问 AI 就够了",     bg:C.blueLight,   badge:"随时问", bc:C.blueWarm },
];

// ── Medication Module ──────────────────────────────────────────────────────────

var MEDS_SYS = "你是专业的全球药品识别专家兼温柔护工阿姨。能识别任何语言的药盒（中文、英文、日文、韩文、法文、德文、阿拉伯文等），翻译成中文大白话。\n\n返回JSON（不含代码块标记）：\n{\"detectedLang\":\"识别到的语言\",\"drugName\":\"中文通用名\",\"originalName\":\"药盒原始名称\",\"englishName\":\"英文名\",\"manufacturer\":\"生产厂家\",\"manufacturerCountry\":\"生产国\",\"approvalNo\":\"批准文号\",\"batchNo\":\"批号\",\"expiryDate\":\"有效期\",\"effect\":\"一句话说清楚治什么\",\"dosage\":\"几片，一天几次，饭前饭后\",\"storage\":\"怎么保存\",\"warnings\":[\"注意事项1\"],\"authenticityLevel\":\"genuine|suspicious|unknown\",\"authenticityDetails\":[\"鉴定依据1\"],\"authenticityAdvice\":\"真伪建议\",\"safeInfo\":\"放心提示\",\"speakText\":\"温暖口吻总结\"}\n\n真伪依据：批准文号格式（中国国药准字H/Z/S+8位；美国NDC；欧盟EU/1/）、知名药企、印刷质量。";

var AUTH_CFG = {
  genuine:    { bg:C.greenLight, border:C.greenWarm + "40", color:C.greenWarm, icon:"✅", label:"正规药品"     },
  suspicious: { bg:"#FFF3E0",    border:"#E6510040",         color:"#BF360C",   icon:"⚠️", label:"存在疑点"     },
  unknown:    { bg:"#F3F3F3",    border:"#78787840",          color:"#555",     icon:"❓", label:"无法完全判断" },
};

function MedsModule({ onBack }) {
  var _phase = useState("upload"); var phase = _phase[0]; var setPhase = _phase[1];
  var _result = useState(null);   var result = _result[0]; var setResult = _result[1];
  var _err = useState(null);      var err = _err[0];       var setErr = _err[1];
  var img = useImagePicker();

  function analyze() {
    setPhase("loading");
    callClaude(MEDS_SYS, [
      imgBlock(img.b64, img.mime),
      { type:"text", text:"请识别分析这个药品，包括语言识别和真伪鉴别。" },
    ], 1500).then(function(data) {
      setResult(data); setPhase("result");
    }).catch(function(e) { setErr(e.message); setPhase("error"); });
  }

  function reset() { setPhase("upload"); setResult(null); setErr(null); img.clear(); }

  var ac = result ? (AUTH_CFG[result.authenticityLevel] || AUTH_CFG.unknown) : null;

  return (
    <div style={{ maxWidth:520, margin:"0 auto", padding:"36px 20px 80px", position:"relative", zIndex:2 }}>
      <BackBtn onBack={onBack} />
      <div style={{ textAlign:"center", marginBottom:32 }}>
        <div style={{ fontSize:48 }}>💊</div>
        <div style={{ fontSize:28, fontWeight:800, marginTop:8 }}>药品说明助手</div>
        <div style={{ fontSize:16, color:C.mutedText, marginTop:6 }}>支持中英日韩等各国药盒 · 自动真伪鉴别</div>
      </div>

      {phase === "upload" && (
        <div>
          <div onClick={function() { img.ref.current && img.ref.current.click(); }} style={{
            background:"rgba(255,255,255,0.65)", border:"2px dashed " + C.stone,
            borderRadius:24, padding:"44px 20px", textAlign:"center", cursor:"pointer",
            backdropFilter:"blur(8px)",
          }}>
            <div style={{ fontSize:60, marginBottom:16 }}>📷</div>
            <div style={{ fontSize:22, fontWeight:700, marginBottom:8 }}>点这里拍照</div>
            <div style={{ fontSize:16, color:C.mutedText, lineHeight:1.7 }}>看不懂没关系，AI 来帮您<br />一句话说清楚怎么吃</div>
            <div style={{ marginTop:24, background:C.accent, color:"#FFF8F0", borderRadius:50, padding:"14px 36px", fontSize:19, fontWeight:700, display:"inline-block" }}>
              选择照片 / 拍照
            </div>
            <input ref={img.ref} type="file" accept="image/*" capture="environment"
              style={{ display:"none" }} onChange={function(e) { img.load(e.target.files[0]); }} />
          </div>
          {img.src && (
            <div style={{ marginTop:16, background:"rgba(255,255,255,0.65)", borderRadius:22, padding:16, backdropFilter:"blur(8px)" }}>
              <img src={img.src} alt="药盒" style={{ width:"100%", borderRadius:14, maxHeight:260, objectFit:"cover", display:"block" }} />
              <BigBtn onClick={analyze} bg={C.accent}>🔍 分析这个药</BigBtn>
              <GhostBtn onClick={img.clear}>重新选一张</GhostBtn>
            </div>
          )}
        </div>
      )}

      {phase === "loading" && <Spinner emoji="🤔" text={"正在仔细看这个药盒…\n马上就好，请稍等"} />}

      {phase === "result" && result && ac && (
        <div>
          <Card>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
              <span style={{ background:C.accentLight, borderRadius:50, padding:"3px 12px", fontSize:13, color:C.accent, fontWeight:700 }}>
                {result.detectedLang || "药品"}
              </span>
            </div>
            <div style={{ fontSize:32, fontWeight:900, lineHeight:1.15, color:C.warmText }}>{result.drugName}</div>
            {result.originalName && result.originalName !== result.drugName && (
              <div style={{ fontSize:15, color:C.mutedText, marginTop:3, fontStyle:"italic" }}>{result.originalName}</div>
            )}
            {result.englishName && result.englishName !== "null" && (
              <div style={{ fontSize:15, color:C.mutedText, marginTop:2 }}>{result.englishName}</div>
            )}
            {result.effect && (
              <div style={{ fontSize:17, color:C.warmText, marginTop:10, lineHeight:1.5, paddingTop:10, borderTop:"1px solid " + C.linen }}>
                {result.effect}
              </div>
            )}
          </Card>

          <div style={{ background:ac.bg, border:"2px solid " + ac.border, borderRadius:22, padding:"18px 20px", marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <span style={{ fontSize:24 }}>{ac.icon}</span>
              <div>
                <div style={{ fontSize:12, color:ac.color, fontWeight:700 }}>真伪鉴定</div>
                <div style={{ fontSize:20, fontWeight:900, color:ac.color }}>{ac.label}</div>
              </div>
            </div>
            {result.authenticityDetails && result.authenticityDetails.map(function(d, i) {
              return (
                <div key={i} style={{ display:"flex", gap:8, marginBottom:5 }}>
                  <span style={{ color:ac.color, fontSize:13, marginTop:3, flexShrink:0 }}>•</span>
                  <span style={{ fontSize:15, color:C.warmText, lineHeight:1.5 }}>{d}</span>
                </div>
              );
            })}
            {result.authenticityAdvice && (
              <div style={{ marginTop:10, paddingTop:10, borderTop:"1px solid " + ac.color + "20", fontSize:15, color:ac.color, lineHeight:1.6 }}>
                {result.authenticityAdvice}
              </div>
            )}
          </div>

          <Card>
            <div style={{ fontSize:13, color:C.mutedText, fontWeight:700, marginBottom:10 }}>📋 药品档案</div>
            {[
              ["生产厂家", result.manufacturer],
              ["生产国",   result.manufacturerCountry],
              ["批准文号", result.approvalNo],
              ["批号",     result.batchNo],
              ["有效期",   result.expiryDate],
            ].filter(function(r) { return r[1] && r[1] !== "null"; }).map(function(row, i) {
              return (
                <div key={i} style={{ display:"flex", justifyContent:"space-between", padding:"7px 0", borderBottom:"1px solid " + C.linen, gap:10 }}>
                  <span style={{ fontSize:15, color:C.mutedText, flexShrink:0 }}>{row[0]}</span>
                  <span style={{ fontSize:15, color:C.warmText, fontWeight:600, textAlign:"right", wordBreak:"break-all" }}>{row[1]}</span>
                </div>
              );
            })}
          </Card>

          {result.dosage   && <InfoCard icon="🕐" label="怎么吃" text={result.dosage} />}
          {result.storage  && <InfoCard icon="📦" label="怎么保存" text={result.storage} />}
          {result.warnings && result.warnings.map(function(w, i) {
            return <InfoCard key={i} icon="⚠️" label="注意事项" text={w} bg={C.redLight} color={C.redWarm} labelColor={C.redWarm} />;
          })}
          {result.safeInfo && <InfoCard icon="✅" label="放心提示" text={result.safeInfo} bg={C.greenLight} color={C.greenWarm} labelColor={C.greenWarm} />}
          {result.speakText && (
            <div style={{ background:"linear-gradient(135deg," + C.linen + "," + C.cream + ")", borderRadius:18, padding:"16px 18px", border:"1.5px solid " + C.stone + "40", marginBottom:10 }}>
              <div style={{ fontSize:12, color:C.mutedText, fontWeight:600, marginBottom:5 }}>👵 AI 用大白话说</div>
              <div style={{ fontSize:18, lineHeight:1.8, fontWeight:500 }}>"{result.speakText}"</div>
            </div>
          )}
          <GhostBtn onClick={reset}>↩ 重新拍一张药盒</GhostBtn>
        </div>
      )}

      {phase === "error" && <ErrBox msg={err} onReset={reset} />}
    </div>
  );
}

// ── Anti-Fraud Module ──────────────────────────────────────────────────────────

var FRAUD_SYS = "你是专门帮助老年人防范电信诈骗的安全顾问，像家人一样温暖说话。能识别所有诈骗：冒充公检法、杀猪盘、虚假中奖、冒充熟人、假冒客服、钓鱼网站、仿冒APP、虚假投资等。对截图要观察发件人、链接域名、界面设计、文字措辞。\n\n返回JSON（不含代码块标记）：\n{\"fraudType\":\"诈骗类型\",\"level\":\"red|yellow|green\",\"summary\":\"一句话总结风险\",\"tactics\":[\"特征1\",\"特征2\"],\"visualClues\":[\"截图可疑线索（文字时填空数组）\"],\"advice\":\"家人口吻建议\",\"action\":\"现在最应该做的\",\"hotline\":\"举报电话\"}\nred=明确诈骗 yellow=可疑 green=正常";

var LEVEL_CFG = {
  red:    { bg:C.redLight,   border:C.redWarm   + "50", color:C.redWarm,   icon:"🚨", label:"高风险·请勿相信" },
  yellow: { bg:"#FFFBE6",    border:"#E6B80080",          color:"#7A5000",   icon:"⚠️", label:"存在疑点·需谨慎" },
  green:  { bg:C.greenLight, border:C.greenWarm + "40", color:C.greenWarm, icon:"✅", label:"基本正常"         },
};

var EXAMPLES = [
  "您好，您的包裹因违禁品被扣押，请立即联系公安局配合调查，否则将依法逮捕...",
  "恭喜您中奖了！价值5万元大奖，请点击链接领取，需缴纳200元手续费...",
  "我是您儿子的朋友，他出了事在医院，需要您立刻转账1万元应急...",
];

function FraudModule({ onBack }) {
  var _mode = useState("text");   var mode = _mode[0];   var setMode = _mode[1];
  var _text = useState("");       var text = _text[0];   var setText = _text[1];
  var _phase = useState("input"); var phase = _phase[0]; var setPhase = _phase[1];
  var _result = useState(null);   var result = _result[0]; var setResult = _result[1];
  var _err = useState(null);      var err = _err[0];     var setErr = _err[1];
  var img = useImagePicker();

  var canGo = mode === "text" ? text.trim().length > 0 : img.b64 !== null;

  function analyze() {
    setPhase("loading");
    var userContent = mode === "text"
      ? ("请分析这条消息是否是诈骗：\n\n" + text)
      : [imgBlock(img.b64, img.mime), { type:"text", text:"请仔细分析这张截图，判断是否是诈骗，注意所有视觉细节。" }];
    callClaude(FRAUD_SYS, userContent, 1000).then(function(data) {
      setResult(data); setPhase("result");
    }).catch(function(e) { setErr(e.message); setPhase("error"); });
  }

  function reset() { setPhase("input"); setText(""); setResult(null); setErr(null); img.clear(); }

  var lc = result ? (LEVEL_CFG[result.level] || LEVEL_CFG.yellow) : null;

  return (
    <div style={{ maxWidth:520, margin:"0 auto", padding:"36px 20px 80px", position:"relative", zIndex:2 }}>
      <BackBtn onBack={onBack} />
      <div style={{ textAlign:"center", marginBottom:28 }}>
        <div style={{ fontSize:48 }}>🛡️</div>
        <div style={{ fontSize:28, fontWeight:800, marginTop:8 }}>防骗安全查验</div>
        <div style={{ fontSize:16, color:C.mutedText, marginTop:6, lineHeight:1.6 }}>收到可疑消息或截图？<br />AI 帮您识别，保护您的安全</div>
      </div>

      {phase === "input" && (
        <div>
          <div style={{ display:"flex", gap:10, marginBottom:16 }}>
            {[{ id:"text", icon:"✏️", label:"粘贴文字" }, { id:"image", icon:"📸", label:"上传截图" }].map(function(m) {
              return (
                <div key={m.id} onClick={function() { setMode(m.id); }} style={{
                  flex:1, textAlign:"center", padding:"13px 0",
                  borderRadius:16, cursor:"pointer", fontSize:17, fontWeight:700,
                  background: mode === m.id ? C.redWarm : "rgba(255,255,255,0.6)",
                  color: mode === m.id ? "#fff" : C.mutedText,
                  border: "1.5px solid " + (mode === m.id ? C.redWarm : C.stone + "60"),
                  transition:"all 0.2s",
                }}>{m.icon} {m.label}</div>
              );
            })}
          </div>

          {mode === "text" && (
            <Card>
              <div style={{ fontSize:15, color:C.mutedText, marginBottom:10, fontWeight:600 }}>把可疑的消息粘贴在这里 👇</div>
              <textarea value={text} onChange={function(e) { setText(e.target.value); }}
                placeholder="例如：您的快递被扣押，请立刻联系公安局…"
                style={{
                  width:"100%", minHeight:130, fontSize:17, lineHeight:1.7,
                  border:"1.5px solid " + C.stone + "60", borderRadius:14, padding:"12px 14px",
                  fontFamily:FONT, color:C.warmText, background:"rgba(255,255,255,0.8)",
                  resize:"vertical", boxSizing:"border-box",
                }} />
              <div style={{ marginTop:12 }}>
                <div style={{ fontSize:13, color:C.mutedText, marginBottom:8, fontWeight:600 }}>常见诈骗示例（点击填入）</div>
                {EXAMPLES.map(function(ex, i) {
                  return (
                    <div key={i} onClick={function() { setText(ex); }} style={{
                      background:"rgba(255,255,255,0.5)", border:"1px solid " + C.stone + "30",
                      borderRadius:12, padding:"9px 14px", marginBottom:7, cursor:"pointer",
                      fontSize:13, color:C.mutedText, lineHeight:1.5,
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap",
                    }}>{ex}</div>
                  );
                })}
              </div>
            </Card>
          )}

          {mode === "image" && (
            <Card>
              {!img.src ? (
                <div onClick={function() { img.ref.current && img.ref.current.click(); }} style={{
                  border:"2px dashed " + C.stone, borderRadius:18,
                  padding:"38px 20px", textAlign:"center", cursor:"pointer",
                }}>
                  <div style={{ fontSize:48, marginBottom:12 }}>📸</div>
                  <div style={{ fontSize:20, fontWeight:700, marginBottom:6 }}>上传可疑截图</div>
                  <div style={{ fontSize:15, color:C.mutedText, lineHeight:1.6 }}>短信截图、微信消息<br />可疑网页、陌生来电截图<br />都可以上传</div>
                  <div style={{ marginTop:16, display:"inline-block", background:C.redWarm, color:"#fff", borderRadius:50, padding:"12px 28px", fontSize:17, fontWeight:700 }}>
                    选择图片
                  </div>
                  <input ref={img.ref} type="file" accept="image/*" capture="environment"
                    style={{ display:"none" }} onChange={function(e) { img.load(e.target.files[0]); }} />
                </div>
              ) : (
                <div>
                  <img src={img.src} alt="截图预览" style={{ width:"100%", borderRadius:14, maxHeight:280, objectFit:"contain", background:"#f0f0f0", display:"block" }} />
                  <GhostBtn onClick={img.clear}>换一张截图</GhostBtn>
                </div>
              )}
            </Card>
          )}

          <BigBtn onClick={analyze} disabled={!canGo} bg={C.redWarm}>
            {mode === "image" && img.src ? "🔍 分析这张截图" : "🔍 立刻查验"}
          </BigBtn>
        </div>
      )}

      {phase === "loading" && <Spinner emoji="🔍" text="正在仔细分析…请稍等" />}

      {phase === "result" && result && lc && (
        <div>
          <div style={{ background:lc.bg, border:"2px solid " + lc.border, borderRadius:24, padding:"22px 20px", marginBottom:12, textAlign:"center" }}>
            <div style={{ fontSize:50, marginBottom:6 }}>{lc.icon}</div>
            <div style={{ fontSize:24, fontWeight:900, color:lc.color }}>{lc.label}</div>
            {result.fraudType && result.level !== "green" && (
              <div style={{ display:"inline-block", marginTop:7, background:lc.color + "18", borderRadius:50, padding:"3px 14px", fontSize:13, color:lc.color, fontWeight:700 }}>
                {result.fraudType}
              </div>
            )}
            <div style={{ fontSize:16, color:lc.color, marginTop:8, lineHeight:1.6, fontWeight:500 }}>{result.summary}</div>
          </div>

          {result.visualClues && result.visualClues.length > 0 && (
            <Card>
              <div style={{ fontSize:13, color:C.mutedText, fontWeight:700, marginBottom:8 }}>📸 截图中发现的可疑迹象</div>
              {result.visualClues.map(function(c, i) {
                return (
                  <div key={i} style={{ display:"flex", gap:8, marginBottom:6 }}>
                    <span style={{ color:C.redWarm, fontWeight:700, flexShrink:0 }}>!</span>
                    <span style={{ fontSize:15, color:C.warmText, lineHeight:1.5 }}>{c}</span>
                  </div>
                );
              })}
            </Card>
          )}

          {result.tactics && result.tactics.length > 0 && (
            <Card>
              <div style={{ fontSize:13, color:C.mutedText, fontWeight:700, marginBottom:8 }}>🕵️ 识别到的诈骗手法</div>
              {result.tactics.map(function(t, i) {
                return (
                  <div key={i} style={{ display:"flex", gap:8, marginBottom:6 }}>
                    <span style={{ color:C.redWarm, flexShrink:0, marginTop:2 }}>•</span>
                    <span style={{ fontSize:15, color:C.warmText, lineHeight:1.5 }}>{t}</span>
                  </div>
                );
              })}
            </Card>
          )}

          {result.advice && (
            <div style={{ background:"linear-gradient(135deg," + C.linen + "," + C.cream + ")", borderRadius:18, padding:"16px 18px", marginBottom:10, border:"1px solid " + C.stone + "40" }}>
              <div style={{ fontSize:12, color:C.mutedText, fontWeight:600, marginBottom:5 }}>👨‍👩‍👧 家人提醒您</div>
              <div style={{ fontSize:17, lineHeight:1.8, fontWeight:500 }}>"{result.advice}"</div>
            </div>
          )}

          {result.action  && <InfoCard icon="📋" label="现在最应该做的" text={result.action}  bg={C.blueLight}  color={C.blueWarm}  labelColor={C.blueWarm}  />}
          {result.hotline && <InfoCard icon="📞" label="举报 / 求助电话" text={result.hotline} bg={C.greenLight} color={C.greenWarm} labelColor={C.greenWarm} />}
          <GhostBtn onClick={reset}>↩ 再查验一条</GhostBtn>
        </div>
      )}

      {phase === "error" && <ErrBox msg={err} onReset={reset} />}
    </div>
  );
}

// ── Digital Guide Module ───────────────────────────────────────────────────────

var GUIDE_SYS = '你是专门帮助老年人学会使用智能手机的耐心教练。像对奶奶说话一样温柔，不用“点击”“配置”“刷新”等术语，用“按”“找”“看到”“点那个”等，每步配合方位描述。\n\n返回JSON（不含代码块标记）：\n{"title":"简短标题","steps":["第一步：…","第二步：…"],"tip":"小提示","encourage":"鼓励的话"}';

var QUICK_Q = [
  "怎么用微信发红包？",
  "怎么用支付宝扫码付钱？",
  "怎么在手机上预约挂号？",
  "怎么叫网约车（滴滴）？",
  "怎么和家人视频通话？",
  "怎么把照片发给家人？",
];

function GuideModule({ onBack }) {
  var _q = useState("");          var q = _q[0];         var setQ = _q[1];
  var _phase = useState("input"); var phase = _phase[0]; var setPhase = _phase[1];
  var _result = useState(null);   var result = _result[0]; var setResult = _result[1];
  var _err = useState(null);      var err = _err[0];     var setErr = _err[1];

  function ask(question) {
    var finalQ = question || q;
    if (!finalQ.trim()) return;
    setQ(finalQ); setPhase("loading");
    callClaude(GUIDE_SYS, finalQ, 800).then(function(data) {
      setResult(data); setPhase("result");
    }).catch(function(e) { setErr(e.message); setPhase("error"); });
  }

  function reset() { setPhase("input"); setQ(""); setResult(null); setErr(null); }

  return (
    <div style={{ maxWidth:520, margin:"0 auto", padding:"36px 20px 80px", position:"relative", zIndex:2 }}>
      <BackBtn onBack={onBack} />
      <div style={{ textAlign:"center", marginBottom:32 }}>
        <div style={{ fontSize:48 }}>📱</div>
        <div style={{ fontSize:28, fontWeight:800, marginTop:8 }}>手机操作指南</div>
        <div style={{ fontSize:16, color:C.mutedText, marginTop:6, lineHeight:1.6 }}>不会用手机某个功能？<br />用大白话问，AI 一步步教您</div>
      </div>

      {phase === "input" && (
        <div>
          <Card>
            <div style={{ fontSize:15, color:C.mutedText, marginBottom:10, fontWeight:600 }}>您想学什么？直接问 👇</div>
            <textarea value={q} onChange={function(e) { setQ(e.target.value); }}
              placeholder="例如：怎么用微信发红包？"
              style={{
                width:"100%", minHeight:100, fontSize:18, lineHeight:1.7,
                border:"1.5px solid " + C.stone + "60", borderRadius:14, padding:"12px 14px",
                fontFamily:FONT, color:C.warmText, background:"rgba(255,255,255,0.8)",
                resize:"none", boxSizing:"border-box",
              }} />
            <BigBtn onClick={function() { ask(); }} disabled={!q.trim()} bg={C.blueWarm}>📖 告诉我怎么做</BigBtn>
          </Card>
          <div style={{ fontSize:14, color:C.mutedText, marginBottom:10, paddingLeft:2, fontWeight:600 }}>常见问题，点一下就能问</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            {QUICK_Q.map(function(item, i) {
              return (
                <div key={i} onClick={function() { ask(item); }} style={{
                  background:"rgba(255,255,255,0.6)", border:"1px solid " + C.stone + "40",
                  borderRadius:16, padding:"14px 14px", cursor:"pointer",
                  fontSize:16, color:C.warmText, lineHeight:1.5, fontWeight:500, textAlign:"center",
                }}>{item}</div>
              );
            })}
          </div>
        </div>
      )}

      {phase === "loading" && <Spinner emoji="📖" text="正在准备教程…马上就好" />}

      {phase === "result" && result && (
        <div>
          <div style={{ background:C.blueLight, borderRadius:20, padding:"18px 20px", marginBottom:12, border:"1.5px solid " + C.blueWarm + "30" }}>
            <div style={{ fontSize:13, color:C.blueWarm, fontWeight:700, marginBottom:4 }}>📱 {q}</div>
            <div style={{ fontSize:22, fontWeight:800, color:C.blueWarm }}>{result.title}</div>
          </div>
          <Card>
            <div style={{ fontSize:14, color:C.mutedText, fontWeight:700, marginBottom:12 }}>一步一步来，不着急 👇</div>
            {result.steps && result.steps.map(function(s, i) {
              return (
                <div key={i} style={{ display:"flex", gap:14, alignItems:"flex-start", marginBottom:14 }}>
                  <div style={{ width:34, height:34, borderRadius:"50%", background:C.blueWarm, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, fontWeight:800, flexShrink:0 }}>{i+1}</div>
                  <div style={{ fontSize:17, lineHeight:1.7, color:C.warmText, paddingTop:5 }}>{s.replace(/^第.步[：:]\s*/,"")}</div>
                </div>
              );
            })}
          </Card>
          {result.tip && <InfoCard icon="💡" label="小提示" text={result.tip} />}
          {result.encourage && (
            <div style={{ background:"linear-gradient(135deg," + C.linen + "," + C.cream + ")", borderRadius:18, padding:"16px 18px", border:"1.5px solid " + C.stone + "40", textAlign:"center", marginBottom:10 }}>
              <div style={{ fontSize:18, lineHeight:1.7, fontWeight:500 }}>🌟 {result.encourage}</div>
            </div>
          )}
          <GhostBtn onClick={reset}>↩ 再问一个问题</GhostBtn>
        </div>
      )}

      {phase === "error" && <ErrBox msg={err} onReset={reset} />}
    </div>
  );
}

// ── Root ───────────────────────────────────────────────────────────────────────

function App() {
  var _page = useState("home"); var page = _page[0]; var setPage = _page[1];
  return (
    <div style={{
      minHeight:"100vh",
      background:"linear-gradient(155deg," + C.cream + " 0%," + C.linen + " 100%)",
      fontFamily:FONT, color:C.warmText,
    }}>
      <style>{"\
        @keyframes pulse{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1.1);opacity:1}}\
        @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}\
        *{box-sizing:border-box}\
        button:active{opacity:0.85}\
      "}</style>
      {page === "home"  && <Home  onNav={setPage} />}
      {page === "meds"  && <MedsModule  onBack={function() { setPage("home"); }} />}
      {page === "fraud" && <FraudModule onBack={function() { setPage("home"); }} />}
      {page === "guide" && <GuideModule onBack={function() { setPage("home"); }} />}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
